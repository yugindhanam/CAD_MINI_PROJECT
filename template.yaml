AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Campus Find authenticated lost and found portal
Parameters:
  CampusDomain:
    Type: String
    Default: campus.edu
    AllowedPattern: "[a-zA-Z0-9.-]+"
  FrontendOrigin:
    Type: String
    Default: http://127.0.0.1:5173
    Description: Additional allowed origin for local AWS-mode development
Resources:
  HostingApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub "${AWS::StackName}-web"
      Platform: WEB
      CustomHeaders: |
        customHeaders:
          - pattern: '**/*'
            headers:
              - key: X-Content-Type-Options
                value: nosniff
              - key: Referrer-Policy
                value: strict-origin-when-cross-origin
  HostingBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt HostingApp.AppId
      BranchName: main
      Stage: PRODUCTION
      EnableAutoBuild: false
  Records:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gpk, AttributeType: S }
        - { AttributeName: gsk, AttributeType: S }
        - { AttributeName: opk, AttributeType: S }
        - { AttributeName: osk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: ByKind
          KeySchema:
            - { AttributeName: gpk, KeyType: HASH }
            - { AttributeName: gsk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: ByOwner
          KeySchema:
            - { AttributeName: opk, KeyType: HASH }
            - { AttributeName: osk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
  Photos:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendOrigin
              - !Sub "https://main.${HostingApp.DefaultDomain}"
            AllowedMethods: [GET, POST]
            AllowedHeaders: ["*"]
            MaxAge: 300
  SignupGuard:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Handler: preSignup.handler
      CodeUri: backend/
      Environment:
        Variables:
          CAMPUS_DOMAIN: !Ref CampusDomain
      Policies: [AWSLambdaBasicExecutionRole]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [preSignup.ts]
        Target: es2022
        Minify: true
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      UsernameConfiguration: { CaseSensitive: false }
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      Schema:
        - { Name: email, Required: true, Mutable: true }
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      LambdaConfig:
        PreSignUp: !GetAtt SignupGuard.Arn
  SignupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SignupGuard
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn
  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      ReadAttributes: [email, email_verified]
      WriteAttributes: [email]
  Administrators:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Administrators
      UserPoolId: !Ref UserPool
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
          - !Sub "https://main.${HostingApp.DefaultDomain}"
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 30
        ThrottlingRateLimit: 15
      Auth:
        DefaultAuthorizer: CampusJwt
        Authorizers:
          CampusJwt:
            IdentitySource: "$request.header.Authorization"
            AuthorizationScopes: [aws.cognito.signin.user.admin]
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref AppClient]
  Backend:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Handler: handler.handler
      CodeUri: backend/
      Timeout: 20
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref Records
          BUCKET_NAME: !Ref Photos
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Records }
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${Photos.Arn}/*"
      Events:
        Preflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: "/{proxy+}"
            Method: OPTIONS
            Auth: {Authorizer: NONE}
        RootPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: "/"
            Method: OPTIONS
            Auth: {Authorizer: NONE}
        Root:
          {
            Type: HttpApi,
            Properties: { ApiId: !Ref Api, Path: "/", Method: ANY },
          }
        Routes:
          {
            Type: HttpApi,
            Properties: { ApiId: !Ref Api, Path: "/{proxy+}", Method: ANY },
          }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [handler.ts]
        Target: es2022
        Minify: true
Outputs:
  FrontendUrl:
    Value: !Sub "https://main.${HostingApp.DefaultDomain}"
  AmplifyAppId: { Value: !GetAtt HostingApp.AppId }
  CampusEmailDomain: { Value: !Ref CampusDomain }
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  UserPoolId: { Value: !Ref UserPool }
  UserPoolClientId: { Value: !Ref AppClient }
  PhotoBucket: { Value: !Ref Photos }
  TableName: { Value: !Ref Records }
